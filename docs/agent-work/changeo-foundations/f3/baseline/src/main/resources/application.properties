spring.application.name=changeo
spring.profiles.default=sandbox
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.tomcat.accesslog.enabled=false
spring.datasource.url=${CHANGEO_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/changeo}
spring.datasource.username=${CHANGEO_DATABASE_USER:changeo}
spring.datasource.password=${CHANGEO_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
changeo.real-money=false
changeo.synthetic-evidence=false
changeo.mailbox=${CHANGEO_MAILBOX:.runtime/mailbox}
changeo.mfa-key=${CHANGEO_MFA_KEY:.runtime/mfa.key}
server.error.include-message=never
server.error.include-stacktrace=never
spring.flyway.schemas=sandbox
spring.flyway.default-schema=sandbox
spring.datasource.hikari.schema=sandbox
spring.jpa.properties.hibernate.default_schema=sandbox

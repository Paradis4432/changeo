<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta de prueba · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Crear cuenta de prueba</h1><div th:replace="~{shell :: notice}"></div><p>Usá únicamente un correo inventado terminado en .test. No se envían correos externos.</p><form th:action="@{/register}" method="post"><label for="contact">Correo sintético</label><input id="contact" name="contact" type="email" maxlength="254" placeholder="persona@ejemplo.test" required autocomplete="username"><label for="password">Contraseña (12 a 72 caracteres)</label><input id="password" name="password" type="password" minlength="12" maxlength="72" required autocomplete="new-password"><button>Crear cuenta</button></form></main><footer th:replace="~{shell :: footer}"></footer></body></html>

<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controles de identidad sintética · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Controles de identidad sintética</h1><div th:replace="~{shell :: notice}"></div><p>Hasta 100 cuentas. Evidencia válida durante 24 horas de prueba; nunca certifica elegibilidad pública. No se puede aprobar la propia cuenta ni asignar roles desde la web.</p><a href="/admin/audit">Auditoría</a><section class="card" th:each="account : ${accounts}"><h2 th:text="${account.id}"></h2><p>Contacto: <span th:text="${account.contactVerified ? 'Verificado sintético' : 'Pendiente'}"></span> · Edad: <span th:text="${account.age &lt; 0 ? 'Pendiente' : account.age}"></span> · <span th:text="${account.restricted ? 'Restringida' : 'Sin restricción'}"></span></p><form th:if="${identityAdmin}" th:action="@{/admin/accounts/{id}/eligibility(id=${account.id})}" method="post"><label th:for="${'kind-' + account.id}">Evidencia sintética separada</label><select th:id="${'kind-' + account.id}" name="kind"><option value="AGE">Edad</option><option value="MINOR_DRAFT">Consentimiento para borrador de menor</option><option value="PROVIDER_ELIGIBILITY">Política legal y partner de proveedor</option><option value="PROVIDER_KYC">KYC de proveedor</option><option value="OPTIONAL_BADGE">Distintivo opcional</option></select><label th:for="${'age-' + account.id}">Edad de prueba (solo evidencia de edad)</label><input th:id="${'age-' + account.id}" name="age" type="number" min="0" max="120"><button>Registrar evidencia sintética</button></form><form th:if="${restrictionAdmin}" th:action="@{/admin/accounts/{id}/restriction(id=${account.id})}" method="post"><input type="hidden" name="active" th:value="${!account.restricted}"><button class="secondary" th:text="${account.restricted ? 'Quitar restricción' : 'Restringir nuevas acciones'}"></button></form><form th:if="${identityAdmin and !#lists.isEmpty(account.roles)}" th:action="@{/admin/accounts/{id}/role/remove(id=${account.id})}" method="post"><label th:for="${'role-' + account.id}">Rol a retirar</label><select th:id="${'role-' + account.id}" name="role"><option th:each="role : ${account.roles}" th:value="${role}" th:text="${role}"></option></select><button class="secondary">Retirar rol e invalidar sesiones</button></form></section><section class="card" th:each="link : ${links}"><h2>Relación <span th:text="${link.id}"></span></h2><p th:text="${link.status}"></p><form th:if="${link.status == 'PENDING'}" th:action="@{/admin/guardian/{id}/review(id=${link.id})}" method="post"><input type="hidden" name="version" th:value="${link.version}"><label th:for="${'review-' + link.id}">Decisión sobre autoridad de prueba</label><select th:id="${'review-' + link.id}" name="verified"><option value="false">Rechazar</option><option value="true">Verificar relación sintética</option></select><button>Registrar revisión independiente</button></form></section></main><footer th:replace="~{shell :: footer}"></footer></body></html>

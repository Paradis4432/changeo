<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar segundo factor · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Verificar segundo factor</h1><div th:replace="~{shell :: notice}"></div><p>Usá el factor único inscrito por el operador local. La web no muestra, inscribe ni reemplaza factores. Una contraseña sola no habilita administración.</p><form th:action="@{/admin/mfa}" method="post"><label for="code">Código de seis dígitos</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button>Verificar MFA</button></form></main><footer th:replace="~{shell :: footer}"></footer></body></html>

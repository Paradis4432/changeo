<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acceso · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Recuperar acceso</h1><div th:replace="~{shell :: notice}"></div><p>La respuesta es igual para cualquier correo. Si existe una cuenta, el código se entrega solo al buzón local privado.</p><form th:action="@{/password/forgot}" method="post"><label for="contact">Correo sintético</label><input id="contact" name="contact" type="email" maxlength="254" required autocomplete="username"><button>Solicitar código</button></form><p><a href="/password/reset">Ya tengo el código privado</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

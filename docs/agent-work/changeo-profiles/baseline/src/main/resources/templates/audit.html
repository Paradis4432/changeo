<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría de identidad · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Auditoría de identidad</h1><div th:replace="~{shell :: notice}"></div><p>Últimos 100 eventos. Registro inmutable; sin contraseñas, códigos, documentos ni secretos.</p><ol class="events"><li th:each="event : ${events}"><strong th:text="${event.action}"></strong> · <time th:text="${event.occurredAt}"></time><p>Actor <code th:text="${event.actorId}"></code> · Sujeto <code th:text="${event.subjectId}"></code> · <span th:text="${event.scope}"></span></p></li></ol></main><footer th:replace="~{shell :: footer}"></footer></body></html>

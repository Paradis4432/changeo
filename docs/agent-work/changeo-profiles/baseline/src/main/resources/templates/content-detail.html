<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contenido sintético aprobado · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Revisión aprobada de prueba</h1><p>Solo ejemplos sintéticos en servidor local.</p><p th:if="${content.label == 'SENSITIVE'}" class="notice">Advertencia: contenido sensible relacionado con anatomía o medicina.</p><p th:if="${content.label == 'ADULT'}" class="notice">Contenido adulto: edad y preferencia actuales requeridas.</p><pre th:text="${content.text}"></pre><ul><li th:each="file : ${content.attachments}"><a th:href="@{/content/files/{id}(id=${file.id},resource=${file.content.resourceId},revision=${file.content.revisionId},digest=${file.digest})}">Descargar adjunto aprobado</a></li></ul><p><a href="/content">Buscar ejemplos</a> · <a href="/moderation">Taller</a></p><details><summary>Reportar este contenido</summary><form th:action="@{/moderation/cases}" method="post"><input type="hidden" name="command" th:value="${command}"><input type="hidden" name="resource" th:value="${content.reference.resourceId}"><input type="hidden" name="revision" th:value="${content.reference.revisionId}"><input type="hidden" name="kind" value="REPORT"><label for="reason">Motivo</label><select id="reason" name="reason"><option value="MISLABEL">Etiqueta incorrecta</option><option value="SAFETY">Seguridad</option><option value="OTHER">Otro</option></select><label for="note">Información de prueba</label><textarea id="note" name="note" maxlength="2000"></textarea><button type="submit">Enviar reporte</button></form></details></main><footer th:replace="~{shell :: footer}"></footer></body></html>

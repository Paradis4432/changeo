<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cola de moderación · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1 th:text="${audit ? 'Auditoría de metadatos' : 'Revisión humana de prueba'}"></h1><p th:text="${audit ? 'Sin texto, notas privadas ni bytes de adjuntos.' : 'Evidencia segura y limitada. No autoriza pagos, multas ni restricciones de identidad.'}"></p><div th:replace="~{shell :: notice}"></div>
<section th:if="${!audit}"><h2>Revisiones pendientes</h2><p th:if="${submissions.isEmpty()}">No hay revisiones pendientes.</p><article th:each="item : ${submissions}"><p class="identifier" th:text="${item.revision_id}"></p><p th:text="${@moderationWords.state(item.state)}"></p><a th:href="@{/moderation/evidence(resource=${item.resource_id},revision=${item.revision_id},kind=${item.kind})}">Inspeccionar evidencia segura</a><form th:action="@{/moderation/operator/case}" method="post"><input type="hidden" name="command" th:value="${newCommand}"><input type="hidden" name="resource" th:value="${item.resource_id}"><input type="hidden" name="revision" th:value="${item.revision_id}"><input type="hidden" name="kind" th:value="${item.kind}"><button type="submit">Tomar revisión como caso</button></form></article></section>
<section><h2>Casos (máximo 50)</h2><p th:if="${cases.isEmpty()}">No hay casos.</p><article th:each="item : ${cases}"><h3 th:text="${item.kind == 'APPEAL' ? 'Apelación' : 'Reporte / revisión'}"></h3><p class="identifier" th:text="${item.id}"></p><p th:text="${@moderationWords.state(item.state)}"></p><p th:text="${@moderationWords.reason(item.reason)}"></p><p th:if="${!audit}" th:text="${item.note}"></p><details th:if="${!audit and item.state != 'RESOLVED'}"><summary>Revisar acciones del caso</summary><form th:action="@{/moderation/operator/action}" method="post"><input type="hidden" name="command" th:value="${newCommand}"><input type="hidden" name="caseId" th:value="${item.id}"><input type="hidden" name="version" th:value="${item.version}"><label th:for="${'action-'+item.id}">Acción explícita</label><select th:id="${'action-'+item.id}" name="action"><option value="TAKE">Tomar caso</option><option value="APPROVE">Aprobar revisión exacta</option><option value="CORRECT_LABEL">Corregir etiqueta y aprobar</option><option value="HOLD">Retener para revisión</option><option value="REJECT">Rechazar</option><option value="RECALL">Retirar aprobación</option><option value="WARNING">Registrar advertencia reversible</option><option value="STRIKE">Registrar señal reversible</option><option value="RESOLVE">Resolver sin cambiar aprobación</option></select><label th:for="${'label-'+item.id}">Etiqueta confirmada</label><select th:id="${'label-'+item.id}" name="label"><option value="GENERAL">General</option><option value="SENSITIVE">Sensible</option><option value="ADULT">Adulto</option></select><label th:for="${'reason-'+item.id}">Motivo</label><select th:id="${'reason-'+item.id}" name="reason"><option value="SAFETY">Seguridad</option><option value="MISLABEL">Etiqueta incorrecta</option><option value="FALSE_POSITIVE">Revisión incorrecta</option><option value="OTHER">Otro</option></select><button type="submit">Registrar decisión</button></form></details></article></section>
<section><h2>Advertencias y señales reversibles</h2><p>Son evidencia humana; no restringen cuentas ni afectan dinero.</p><article th:each="item : ${evidence}"><p class="identifier" th:text="${item.id}"></p><p th:text="${@moderationWords.state(item.kind) + ' · ' + (item.withdrawn ? 'Retirada' : 'Vigente')}"></p><form th:if="${!audit and !item.withdrawn}" th:action="@{/moderation/operator/withdraw}" method="post"><input type="hidden" name="command" th:value="${newCommand}"><input type="hidden" name="evidenceId" th:value="${item.id}"><input type="hidden" name="version" th:value="${item.version}"><button type="submit">Retirar evidencia</button></form></article></section><p><a href="/moderation/operator/signin">Renovar MFA y autenticación reciente</a> · <a href="/moderation">Taller</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

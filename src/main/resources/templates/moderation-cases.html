<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis casos · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Mis reportes y apelaciones</h1><p>Los casos y ayuda siguen disponibles si se restringe tu participación.</p><div th:replace="~{shell :: notice}"></div><p th:if="${cases.isEmpty()}">No hay casos todavía.</p><section th:each="item : ${cases}"><h2 th:text="${item.kind == 'APPEAL' ? 'Apelación' : 'Reporte'}"></h2><p class="identifier" th:text="${item.id}"></p><p th:text="${@moderationWords.state(item.state)}"></p><a th:if="${item.kind == 'APPEAL'}" th:href="@{/moderation/own/{id}(id=${item.resource_id})}">Consultar estado propio</a><a th:if="${item.kind == 'REPORT'}" th:href="@{/content/{id}(id=${item.resource_id})}">Consultar revisión visible</a></section><p><a href="/moderation">Volver al taller</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

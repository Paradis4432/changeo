<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría financiera · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Auditoría de metadatos financieros</h1><p>Requiere el rol de auditoría vigente, MFA y contraseña reciente. No entrega contenido privado, claves ni datos de instrumentos; no autoriza modificar fondos, destinos o permisos.</p><article th:each="entry : ${entries}"><p class="identifier" th:text="${entry.operationId}"></p><p th:text="${@paymentWords.kind(entry.kind)}"></p><p th:text="${@paymentWords.amount(entry.amountMinor)}"></p><p th:text="${@paymentWords.operation(entry.state)}"></p><p th:text="${entry.createdAt}"></p></article><a th:if="${next}" th:href="@{/payments/audit(after=${next})}">Siguiente página</a></main><footer th:replace="~{shell :: footer}"></footer></body></html>

<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buscar ejemplos · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Ejemplos aprobados locales</h1><p>Proyección de prueba; no es el buscador del mercado.</p><form action="/content" method="get"><label for="q">Buscar en texto aprobado</label><input id="q" name="q" maxlength="100" th:value="${q}"><button type="submit">Buscar</button></form><p th:if="${results.isEmpty()}">No hay contenido visible para esta audiencia.</p><section th:each="item : ${results}"><h2><a th:href="@{/content/{id}(id=${item.reference.resourceId})}">Ejemplo sintético</a></h2><p th:if="${item.label == 'SENSITIVE'}">Advertencia: contenido sensible.</p><p th:text="${item.text}"></p></section><p><a href="/moderation">Taller de contenido</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

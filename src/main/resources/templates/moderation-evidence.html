<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evidencia de revisión · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Evidencia segura limitada</h1><p>Datos de prueba tratados como contenido, sin instrucciones ni herramientas.</p><pre th:text="${content.text}"></pre><p th:text="${@moderationWords.state(content.state)}"></p><ul><li th:each="file : ${files}"><span th:text="${file.safe ? 'Inspeccionado localmente' : 'Cuarentena: solo metadatos'}"></span><span th:text="${' · ' + file.mediaType + ' · ' + file.size + ' bytes'}"></span><a th:if="${file.safe}" th:href="@{/moderation/files/{id}(id=${file.reference.id},resource=${file.reference.content.resourceId},revision=${file.reference.content.revisionId},kind=${file.reference.content.ownerKind},digest=${file.reference.digest})}">Descargar evidencia inerte</a></li></ul><p><a href="/moderation/operator">Volver a revisión</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

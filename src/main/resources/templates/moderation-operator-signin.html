<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MFA de moderación · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Acceso de moderación</h1><p>Requiere una cuenta sintética provisionada con el rol específico. La contraseña sola no permite ver evidencia privada.</p><form th:action="@{/moderation/operator/mfa}" method="post"><label for="code">Código MFA del factor privado</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Verificar MFA</button></form><form th:action="@{/moderation/operator/reauth}" method="post"><label for="password">Contraseña reciente (necesaria para revisión)</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Confirmar y abrir revisión</button></form><p><a href="/moderation/audit">Abrir auditoría de metadatos con MFA</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

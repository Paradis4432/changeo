<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="authoredDetails(details)"><h2 th:text="${details.title}"></h2><p class="authored" th:text="${details.body}"></p><dl class="status"><dt>Zona amplia</dt><dd th:text="${details.area + ', ' + details.province}"></dd><dt>Modalidades</dt><dd><span th:each="mode,loop : ${details.modes}" th:text="${mode.name() == 'LOCAL' ? 'Presencial' : mode.name() == 'REMOTE' ? 'A distancia' : 'Con envío'}"></span></dd><dt>Disponibilidad</dt><dd th:text="${details.availability.isBlank() ? 'A convenir' : details.availability}"></dd><dt>Expectativa orientativa</dt><dd th:text="${details.price()}"></dd><dt th:if="${details.deadline.isPresent()}">Fecha orientativa</dt><dd th:if="${details.deadline.isPresent()}" th:text="${details.deadline.get()}"></dd><dt th:if="${!details.tags.isEmpty()}">Etiquetas</dt><dd th:if="${!details.tags.isEmpty()}" th:text="${#strings.listJoin(details.tags, ', ')}"></dd></dl></section>
<section th:fragment="media(view)" th:if="${!view.attachments.isEmpty()}"><h2>Portafolio y adjuntos aprobados</h2><p>Solo archivos exactos inspeccionados y aprobados. Descargar no constituye garantía de seguridad.</p><ul><li th:each="file : ${view.attachments}"><a th:href="@{/marketplace/files/{id}(id=${file.id},resource=${view.reference.resourceId},revision=${view.reference.revisionId},digest=${file.digest})}">Descargar archivo aprobado</a></li></ul></section>
<details th:fragment="report(view)"><summary>Reportar esta publicación</summary><form th:action="@{/marketplace/cases}" method="post"><input type="hidden" name="command" th:value="${command}"><input type="hidden" name="resource" th:value="${view.reference.resourceId}"><input type="hidden" name="revision" th:value="${view.reference.revisionId}"><input type="hidden" name="kind" value="REPORT"><label for="reason">Motivo</label><select id="reason" name="reason"><option value="SAFETY">Seguridad</option><option value="MISLABEL">Clasificación incorrecta</option><option value="OTHER">Otro</option></select><label for="note">Información sintética opcional</label><textarea id="note" name="note" maxlength="2000"></textarea><button type="submit">Enviar reporte</button></form></details>
</body></html>

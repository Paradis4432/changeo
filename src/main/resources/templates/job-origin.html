<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revisión del caso · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Revisión del caso</h1><p>Consulta de la revisión exacta con tus permisos actuales. Esta vista no cambia el contenido ni el caso.</p><p>Revisión consultada:</p><p class="identifier" th:text="${origin.reference.revisionId}"></p><p role="status" th:text="${@moderationWords.state(origin.state)}"></p><h2 th:text="${@conversationWords.content(origin.kind)}"></h2><p th:text="${@moderationWords.reason(origin.reason)}"></p><p class="authored" th:if="${origin.visible}" th:text="${origin.body}"></p><p th:if="${origin.visible and origin.score != null}">Valoración: <span th:text="${origin.score}"></span> de 5</p><p th:unless="${origin.visible}">Solo estado: el texto no está disponible con la audiencia actual.</p><p><a href="/moderation/cases">Volver a mis casos</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Ingresar</h1><div th:replace="~{shell :: notice}"></div><p th:if="${param.error}" role="alert">No se pudo autenticar. Revisá tus datos.</p><p th:if="${param.expired}" role="alert">La sesión venció o la seguridad de la cuenta cambió. Ingresá otra vez.</p><p th:if="${param.limited}" role="alert">Demasiados intentos. Reintentá en un minuto.</p><form th:action="@{/login}" method="post"><label for="username">Correo sintético</label><input id="username" name="username" type="email" required autocomplete="username"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password"><button>Ingresar</button></form><p><a href="/password/forgot">Recuperar contraseña</a> · <a href="/register">Crear cuenta</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>

<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avisos · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Estado de avisos</h1><p>Los avisos locales tienen su propio estado de entrega. Cada consulta vuelve a verificar tu acceso al contenido aprobado; no se incluyen extractos privados ni pendientes.</p><p th:if="${notices.isEmpty()}">No hay avisos actualmente disponibles.</p><article class="card" th:each="notice : ${notices}"><p th:text="${@conversationWords.notice(notice.state)}"></p></article><a href="/conversations">Abrir conversaciones disponibles</a></main><footer th:replace="~{shell :: footer}"></footer></body></html>

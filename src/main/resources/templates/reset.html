<!doctype html><html lang="es-AR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña · Changeo</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{shell :: header}"></header><main id="main"><h1>Cambiar contraseña</h1><div th:replace="~{shell :: notice}"></div><p th:if="${message}" id="form-error" role="alert" th:text="${message}"></p><p>Pegá el código del archivo privado. Nunca lo incluyas en una dirección web. El código es de un solo uso y vence en 15 minutos.</p><p th:if="${message}" id="secret-reentry">Volvé a ingresar el código privado y la nueva contraseña; no se conservan al reintentar.</p><form th:action="@{/password/reset}" method="post"><label for="token">Código privado</label><input id="token" name="token" th:attr="aria-describedby=${message != null ? 'form-error secret-reentry' : null}" type="password" maxlength="43" required autocomplete="off"><label for="password">Nueva contraseña (12 a 72 caracteres)</label><input id="password" name="password" th:attr="aria-describedby=${message != null ? 'secret-reentry' : null}" type="password" minlength="12" maxlength="72" required autocomplete="new-password"><button>Actualizar contraseña</button></form><p><a href="/password/forgot">Solicitar un nuevo código privado</a></p></main><footer th:replace="~{shell :: footer}"></footer></body></html>
